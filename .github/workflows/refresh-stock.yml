name: Refresh MCD daily prices

on:
  push:
    branches: [main]
    paths:
      - scripts/sync-stock-data.py
      - .github/workflows/refresh-stock.yml
  schedule:
    # 09:37 China time, Tuesday-Saturday, after the previous US session closes.
    - cron: '37 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-mcd-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh validated reference prices
        run: python scripts/sync-stock-data.py
      - name: Commit changed prices
        id: prices
        shell: bash
        run: |
          if git diff --quiet -- assets/mcd-stock-data.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mcd-stock-data.json
          git commit -m 'Refresh MCD daily reference prices'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request Pages rebuild
        if: steps.prices.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Token-authored commits do not trigger Pages automatically; request the build explicitly.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
